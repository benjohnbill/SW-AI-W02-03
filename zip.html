<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>zip(*matrix) Interactive Visualizer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: #0f172a;
      color: #f8fafc;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 800px;
      width: 100%;
    }
    h2 { margin-top: 0; color: #38bdf8; }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled { background: #475569; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #1d4ed8; }
    .step-box {
      border: 1px solid #334155;
      background: #0f172a;
      border-radius: 8px;
      padding: 16px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .matrix-row {
      display: flex;
      gap: 8px;
      margin: 6px 0;
      align-items: center;
    }
    .cell {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    .idx-0 { background: #ef4444; color: white; }
    .idx-1 { background: #3b82f6; color: white; }
    .idx-2 { background: #10b981; color: white; }
    .label { font-size: 0.9rem; color: #94a3b8; margin-bottom: 8px; }
    .code-view {
      margin-top: 15px;
      background: #000;
      padding: 12px;
      border-radius: 6px;
      color: #a5f3fc;
      font-family: monospace;
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Python `zip(*matrix)` Visualizer</h2>
  <div class="controls">
    <button id="prevBtn" onclick="moveStep(-1)">이전 단계</button>
    <button id="nextBtn" onclick="moveStep(1)">다음 단계</button>
    <button onclick="setStep(0)">초기화</button>
  </div>

  <div class="step-box" id="displayArea"></div>
  <div class="code-view" id="codeArea"></div>
</div>

<script>
  let currentStep = 0;
  const steps = [
    {
      title: "Step 1: 원본 행렬 (Original Matrix)",
      code: "matrix = [[1, 2, 3], [4, 5, 6]]",
      render: () => `
        <div class="label">2차원 리스트: 2개의 행(Row)으로 구성</div>
        <div style="border: 2px dashed #64748b; padding: 10px; border-radius: 8px;">
          <div class="matrix-row">
            <span style="color:#94a3b8; width: 60px;">Row 0:</span>
            <div class="cell idx-0">1</div><div class="cell idx-1">2</div><div class="cell idx-2">3</div>
          </div>
          <div class="matrix-row">
            <span style="color:#94a3b8; width: 60px;">Row 1:</span>
            <div class="cell idx-0">4</div><div class="cell idx-1">5</div><div class="cell idx-2">6</div>
          </div>
        </div>
      `
    },
    {
      title: "Step 2: 언패킹 연산자 (*matrix)",
      code: "zip(*matrix) -> zip([1, 2, 3], [4, 5, 6])",
      render: () => `
        <div class="label">외부 리스트가 해제되어 2개의 독립 인자로 zip()에 주입</div>
        <div style="display: flex; gap: 15px; align-items: center;">
          <span style="font-size: 1.2rem; color: #38bdf8;">zip(</span>
          <div style="border: 2px solid #38bdf8; padding: 6px; border-radius: 6px; display: flex; gap: 4px;">
            <div class="cell idx-0">1</div><div class="cell idx-1">2</div><div class="cell idx-2">3</div>
          </div>
          <span style="font-size: 1.2rem; color: #38bdf8;">,</span>
          <div style="border: 2px solid #38bdf8; padding: 6px; border-radius: 6px; display: flex; gap: 4px;">
            <div class="cell idx-0">4</div><div class="cell idx-1">5</div><div class="cell idx-2">6</div>
          </div>
          <span style="font-size: 1.2rem; color: #38bdf8;">)</span>
        </div>
      `
    },
    {
      title: "Step 3: zip()의 열 단위(Column-wise) 인덱스 매칭",
      code: "# Index 0끼리, Index 1끼리, Index 2끼리 수직 추출\n# (1, 4), (2, 5), (3, 6)",
      render: () => `
        <div class="label">같은 색상(동일 인덱스)끼리 튜플로 묶입니다.</div>
        <div style="display: flex; gap: 20px;">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
            <span style="color: #ef4444; font-size: 0.8rem;">Col 0</span>
            <div class="cell idx-0">1</div>
            <div class="cell idx-0">4</div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
            <span style="color: #3b82f6; font-size: 0.8rem;">Col 1</span>
            <div class="cell idx-1">2</div>
            <div class="cell idx-1">5</div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
            <span style="color: #10b981; font-size: 0.8rem;">Col 2</span>
            <div class="cell idx-2">3</div>
            <div class="cell idx-2">6</div>
          </div>
        </div>
      `
    },
    {
      title: "Step 4: 전치 완료 (Transposed Result)",
      code: "result = list(zip(*matrix))\n# Result: [(1, 4), (2, 5), (3, 6)]",
      render: () => `
        <div class="label">최종 3x2 전치 행렬 형태 (튜플 리스트)</div>
        <div style="border: 2px solid #10b981; padding: 12px; border-radius: 8px; display: flex; gap: 12px;">
          <div style="background:#334155; padding: 6px 10px; border-radius: 6px; display: flex; gap: 4px; align-items: center;">
            (<div class="cell idx-0" style="width:30px; height:30px; font-size:0.9rem;">1</div>,
             <div class="cell idx-0" style="width:30px; height:30px; font-size:0.9rem;">4</div>)
          </div>
          <div style="background:#334155; padding: 6px 10px; border-radius: 6px; display: flex; gap: 4px; align-items: center;">
            (<div class="cell idx-1" style="width:30px; height:30px; font-size:0.9rem;">2</div>,
             <div class="cell idx-1" style="width:30px; height:30px; font-size:0.9rem;">5</div>)
          </div>
          <div style="background:#334155; padding: 6px 10px; border-radius: 6px; display: flex; gap: 4px; align-items: center;">
            (<div class="cell idx-2" style="width:30px; height:30px; font-size:0.9rem;">3</div>,
             <div class="cell idx-2" style="width:30px; height:30px; font-size:0.9rem;">6</div>)
          </div>
        </div>
      `
    }
  ];

  function update() {
    const s = steps[currentStep];
    document.getElementById("displayArea").innerHTML = `
      <div style="font-weight: bold; margin-bottom: 12px; color: #facc15;">${s.title}</div>
      ${s.render()}
    `;
    document.getElementById("codeArea").textContent = s.code;
    document.getElementById("prevBtn").disabled = currentStep === 0;
    document.getElementById("nextBtn").disabled = currentStep === steps.length - 1;
  }

  function moveStep(delta) {
    currentStep = Math.max(0, Math.min(steps.length - 1, currentStep + delta));
    update();
  }

  function setStep(step) {
    currentStep = step;
    update();
  }

  update();
</script>
</body>
</html>
